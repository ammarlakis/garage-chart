name: Release Charts

on:
  push:
    branches: [master]

concurrency:
  group: chart-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CHART_NAME: garage

jobs:
  verify:
    uses: ./.github/workflows/ci.yaml
  release:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      chart_asset: ${{ steps.meta.outputs.asset }}
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.3.0
      - uses: kenji-miyake/setup-git-cliff@2778609c643a39a2576c4bae2e493b855eb4aee8 # v2.0.1
      - name: Install helm-docs
        run: |
          curl -fsSL https://github.com/norwoodj/helm-docs/releases/download/v1.14.2/helm-docs_1.14.2_Linux_x86_64.tar.gz |
            tar -xz -C "$RUNNER_TEMP" helm-docs
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Prepare release version, documentation, and changelog
        id: prepare
        run: |
          set -euo pipefail
          chart="charts/$CHART_NAME"
          current_version="$(sed -n 's/^version: //p' "$chart/Chart.yaml")"
          tag="$(git cliff --unreleased --bumped-version)"
          new_version="${tag#v}"
          if [[ "$new_version" == "$current_version" ]]; then
            echo 'No release-worthy changes; skipping release.'
            exit 0
          fi
          sed -i "s/^version: .*/version: $new_version/" "$chart/Chart.yaml"
          helm-docs --chart-search-root "$chart"
          git cliff --unreleased --tag "$tag" > release-notes.md
          git cliff --unreleased --tag "$tag" --prepend CHANGELOG.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Prepared $tag."
      - name: Package chart
        if: steps.prepare.outputs.tag != ''
        id: meta
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          helm package "charts/$CHART_NAME" --destination dist
          echo "asset=$CHART_NAME-${TAG#v}.tgz" >> "$GITHUB_OUTPUT"
      - name: Commit version and push tag
        if: steps.prepare.outputs.tag != ''
        env:
          TAG: ${{ steps.prepare.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "charts/$CHART_NAME/Chart.yaml" "charts/$CHART_NAME/README.md" CHANGELOG.md
          git commit -m "chore(release): prepare for $TAG"
          git tag "$TAG"
          git push --atomic origin HEAD:master "refs/tags/$TAG"
      - name: Publish release package
        if: steps.prepare.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.prepare.outputs.tag }}
          ASSET: ${{ steps.meta.outputs.asset }}
        run: |
          gh release create "$TAG" "dist/$ASSET" --verify-tag --notes-file release-notes.md
  update-registry:
    needs: release
    if: needs.release.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: 2336325
          private-key: ${{ secrets.UPDATE_REGISTRY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Trigger registry update
        uses: the-actions-org/workflow-dispatch@3133c5d135c7dbe4be4f9793872b6ef331b53bc7 # v4
        with:
          repo: ammarlakis/helm-charts
          workflow: Add Chart to Helm Repository
          ref: master
          wait-for-completion: true
          inputs: |
            {
              "repository": "${{ github.repository }}",
              "release_name": "${{ needs.release.outputs.tag }}",
              "chart_asset": "${{ needs.release.outputs.chart_asset }}"
            }
          token: ${{ steps.app-token.outputs.token }}
