# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
header = "# Changelog"
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% if group == "Dependencies" %}\
        {% set commits = commits | reverse | unique(attribute="scope") %}\
    {% endif %}\
    {% for commit in commits %}
        - {% if commit.scope and group != "Dependencies" %}*({{ commit.scope }})* {% endif %}\
            {% if commit.breaking %}[**breaking**] {% endif %}\
            {{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}
"""

[git]
include_paths = ["charts/garage/**"]
exclude_paths = [
  "**/*.md",
  "charts/garage/ci/**",
]
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
commit_parsers = [
  { field = "breaking", pattern = "true", group = "Breaking Changes" },
  # Use the dependency name as the key for displaying only its latest update.
  { message = '(?i)^(?:chore|fix)\(deps[^)]*\): (?:update|pin|roll back) (?:dependency |module |package |helm release )?(\S+)(?: action| docker (?:tag|digest))? to ', group = "Dependencies", scope = "${1}" },
  # Grouped or unrecognized updates retain their full subject as a distinct key.
  { message = '(?i)^(?:chore|fix)\(deps[^)]*\): ([^\r\n]+)', group = "Dependencies", scope = "${1}" },
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
]
filter_commits = true
